set-option -g status on
# set color for status bar
set-option -g status-bg colour235 #base02
set-option -g status-fg yellow #yellow
set -g status-style "dim"

# show host name and IP address on left side of status bar
set -g status-left-length 70
set -g status-left "#[fg=white]: #h : #[fg=green]#(curl --proto '=https' --tlsv1.2 --fail --silent --max-time 2 https://icanhazip.com) #[fg=yellow]#(ifconfig en0 | grep 'inet ' | awk '{print \"en0 \" $2}') #(ifconfig en1 | grep 'inet ' | awk '{print \"en1 \" $2}') #[fg=red]#(ifconfig tun0 | grep 'inet ' | awk '{print \"vpn \" $2}') "

# show session name, window & pane number, date and time on right side of
# status bar
set -g status-right-length 60
# set -g status-right "#[fg=white]#S #I:#P #[fg=yellow]:: %Y-%m-%d #[fg=green]:: #(date | awk '{print $4}') ::"
set -g status-right "#[fg=white]#S #I:#P #[fg=yellow]:: %Y-%m-%d #[fg=green]:: %H:%M:%S ::"

set -g window-status-current-format "#[fg=colour231,bg=colour31,bold]#I:#W"

set -g default-terminal "screen-256color"

set -g mouse on
set -s set-clipboard on

set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -s extended-keys on
